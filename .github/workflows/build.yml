name: Build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/tree/v7.0.1
      - name: Setup mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # https://github.com/jdx/mise-action/tree/v5.2.2
      - name: Install dependencies
        run: mise run deps
      - name: Build
        run: mise run build
