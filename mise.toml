[tools]
go = "1.22.4"

[tasks.deps]
description = "Download Go module dependencies"
run = "go mod download"

[tasks.build]
description = "Build diary-generator"
run = "go build -v ."

[tasks.test]
description = "Run Go tests"
run = "go test ./..."

[tasks.vet]
description = "Run Go static analysis"
run = "go vet ./..."
